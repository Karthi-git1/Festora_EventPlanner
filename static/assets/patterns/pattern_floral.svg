<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110">
  <rect width="110" height="110" fill="#FAF6F0"/>
  <!-- Leaves & Vines -->
  <g fill="#9FB89D" opacity="0.8">
    <ellipse cx="25" cy="30" rx="6" ry="12" transform="rotate(-35 25 30)"/>
    <ellipse cx="38" cy="38" rx="5" ry="10" transform="rotate(25 38 38)"/>
    <ellipse cx="80" cy="80" rx="6" ry="12" transform="rotate(40 80 80)"/>
    <ellipse cx="92" cy="72" rx="5" ry="10" transform="rotate(-20 92 72)"/>
  </g>
  <!-- Blossoms -->
  <g fill="#EAA4A9" opacity="0.9">
    <!-- Flower 1 center 30,30 -->
    <circle cx="30" cy="22" r="5"/>
    <circle cx="38" cy="27" r="5"/>
    <circle cx="35" cy="36" r="5"/>
    <circle cx="25" cy="36" r="5"/>
    <circle cx="22" cy="27" r="5"/>
    <circle cx="30" cy="30" r="3.5" fill="#FDE2E4"/>

    <!-- Flower 2 center 85,85 -->
    <circle cx="85" cy="77" r="5"/>
    <circle cx="93" cy="82" r="5"/>
    <circle cx="90" cy="91" r="5"/>
    <circle cx="80" cy="91" r="5"/>
    <circle cx="77" cy="82" r="5"/>
    <circle cx="85" cy="85" r="3.5" fill="#FDE2E4"/>
  </g>
  <!-- Tiny buds & greenery -->
  <circle cx="70" cy="25" r="3" fill="#D38C93" opacity="0.8"/>
  <circle cx="75" cy="20" r="2" fill="#9FB89D" opacity="0.8"/>
  <circle cx="20" cy="85" r="3" fill="#D38C93" opacity="0.8"/>
  <circle cx="15" cy="90" r="2" fill="#9FB89D" opacity="0.8"/>
  <circle cx="55" cy="60" r="2.5" fill="#C9A098" opacity="0.6"/>
</svg>

