<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <rect width="80" height="80" fill="#FCFAF7"/>
  <!-- Gingham Weave Horizontal Bars -->
  <rect x="0" y="0" width="80" height="40" fill="#E8D7F1" opacity="0.45"/>
  <!-- Gingham Weave Vertical Bars -->
  <rect x="0" y="0" width="40" height="80" fill="#E8D7F1" opacity="0.45"/>
  <!-- Intersection Squares (Darker overlay) -->
  <rect x="0" y="0" width="40" height="40" fill="#D2B0E0" opacity="0.45"/>
  <!-- Delicate cross stitches / dashes for artisan look -->
  <line x1="20" y1="5" x2="20" y2="35" stroke="#FFFFFF" stroke-dasharray="3,4" stroke-width="1.5" opacity="0.6"/>
  <line x1="5" y1="20" x2="35" y2="20" stroke="#FFFFFF" stroke-dasharray="3,4" stroke-width="1.5" opacity="0.6"/>
  <line x1="60" y1="45" x2="60" y2="75" stroke="#C39FD4" stroke-dasharray="2,3" stroke-width="1" opacity="0.4"/>
  <line x1="45" y1="60" x2="75" y2="60" stroke="#C39FD4" stroke-dasharray="2,3" stroke-width="1" opacity="0.4"/>
</svg>

