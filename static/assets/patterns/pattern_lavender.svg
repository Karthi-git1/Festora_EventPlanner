<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#F8F6FD"/>
  <!-- Lavender Stems & Flower Clusters -->
  <g stroke="#8F78B3" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M25,85 Q28,50 35,20"/>
    <path d="M75,90 Q72,55 65,25"/>
  </g>
  <!-- Lavender buds -->
  <g fill="#A68AC9" opacity="0.9">
    <ellipse cx="33" cy="22" rx="3.5" ry="5" transform="rotate(-15 33 22)"/>
    <ellipse cx="37" cy="25" rx="3.5" ry="5" transform="rotate(20 37 25)"/>
    <ellipse cx="32" cy="32" rx="3.5" ry="5" transform="rotate(-20 32 32)"/>
    <ellipse cx="36" cy="35" rx="3.5" ry="5" transform="rotate(15 36 35)"/>
    <ellipse cx="30" cy="42" rx="3" ry="4.5" transform="rotate(-10 30 42)"/>
    <ellipse cx="34" cy="45" rx="3" ry="4.5" transform="rotate(15 34 45)"/>
    
    <ellipse cx="63" cy="27" rx="3.5" ry="5" transform="rotate(-20 63 27)"/>
    <ellipse cx="67" cy="30" rx="3.5" ry="5" transform="rotate(15 67 30)"/>
    <ellipse cx="64" cy="37" rx="3.5" ry="5" transform="rotate(-15 64 37)"/>
    <ellipse cx="68" cy="40" rx="3.5" ry="5" transform="rotate(20 68 40)"/>
    <ellipse cx="66" cy="48" rx="3" ry="4.5" transform="rotate(-10 66 48)"/>
  </g>
  <!-- Tiny floating butterflies / petals -->
  <path d="M50,15 Q54,12 55,16 Q52,19 50,15 Z" fill="#C2ABDF" opacity="0.8"/>
  <path d="M51,15 Q55,18 51,21 Q48,18 51,15 Z" fill="#C2ABDF" opacity="0.8"/>
  <circle cx="85" cy="70" r="2" fill="#B497D6" opacity="0.6"/>
  <circle cx="15" cy="20" r="2" fill="#B497D6" opacity="0.6"/>
  <circle cx="50" cy="75" r="2.5" fill="#B497D6" opacity="0.5"/>
</svg>

